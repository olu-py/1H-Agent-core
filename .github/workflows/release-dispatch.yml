name: Dispatch core release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  dispatch:
    name: Notify downstream repositories
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CORE_UPGRADE_TOKEN: ${{ secrets.CORE_UPGRADE_TOKEN }}
    steps:
      - name: Send release event
        if: ${{ env.CORE_UPGRADE_TOKEN != '' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.CORE_UPGRADE_TOKEN }}
          script: |
            const repositories = [
              { owner: 'olu-py', repo: '1H-Agent-TUI' },
              { owner: 'olu-py', repo: '1H-Agent-webUI' },
            ];
            for (const repository of repositories) {
              await github.rest.repos.createDispatchEvent({
                ...repository,
                event_type: 'core-release',
                client_payload: {
                  tag: context.ref.replace('refs/tags/', ''),
                  sha: context.sha,
                },
              });
            }
      - name: Explain schedule fallback
        if: ${{ env.CORE_UPGRADE_TOKEN == '' }}
        run: echo "::warning::CORE_UPGRADE_TOKEN is not configured; downstream weekly schedules remain the fallback upgrade path."
