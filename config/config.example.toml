[provider]
# Stable identity for this connection profile (used by session rows, the OS
# keyring entry, and cross-provider child agents). Built-ins default to their
# preset key when omitted; a custom provider gets a generated `custom-<uuid>`.
# id = "openai"
# Optional display name. Built-ins and legacy profiles leave it empty and fall
# back to the preset label; a new custom provider requires a non-empty, unique
# name (<= 64 chars).
# name = ""
preset = "open_ai"
kind = "responses"
base_url = "https://api.openai.com/v1"
model = "gpt-5-mini"
thinking_level = "auto"
# Qwen 3.7 only: 1024, 4096, 8192, 16384, or 32768.
# thinking_budget_tokens = 4096
use_previous_response_id = false
# auto | enabled | disabled; DeepSeek Responses API only
native_web_search = "auto"
# Optional override for gateways or new models absent from the built-in registry.
# context_window_tokens = 128000
# Hard cap on the model's output tokens. Also the output reservation subtracted
# from the safe input budget. Responses uses max_output_tokens, OpenAI chat uses
# max_completion_tokens, other chat providers use max_tokens. 0 = provider default.
# max_output_tokens = 8192
# HTTP-level retry with exponential backoff, applied only before any stream
# event has been emitted. retry_max_attempts = 0 disables retries.
retry_max_attempts = 3
retry_initial_backoff_ms = 500
retry_max_backoff_ms = 8000

# Saved provider connections are managed by the Provider settings screen.
# Each built-in preset may appear once; custom providers may be added
# repeatedly, each with its own `id` and unique `name`. API keys remain in the
# OS keyring (keyed by `id`) and are never written here. Older configs with only
# `[provider]` are migrated on save.
# [[providers]]
# id = "deepseek"
# preset = "deep_seek"
# kind = "responses"
# base_url = "https://api.deepseek.com"
# model = "deepseek-v4-flash"
# thinking_level = "high"
# use_previous_response_id = false
# native_web_search = "auto"
#
# A named custom provider (repeatable). `enabled_models` is reserved for a
# future selectable-model picker; empty means "unrestricted" and it is not yet
# enforced when building requests.
# [[providers]]
# id = "custom-0123456789abcdef0123456789abcdef"
# name = "Gateway A"
# preset = "custom"
# kind = "chat_completions"
# base_url = "https://gateway.example/v1"
# model = "my-model"
# enabled_models = []

[ui]
context_meter = true

# Available presets: open_ai, deep_seek, qwen, volcano, custom.
# Qwen's current China endpoint contains your Bailian WorkspaceId:
# https://{WorkspaceId}.cn-beijing.maas.aliyuncs.com/compatible-mode/v1

[runtime]
command_timeout_seconds = 60
max_tool_output_bytes = 1048576
max_fetch_bytes = 10485760
# Hard cap on background session runtimes; the active session is not counted.
# Overflow evicts the least-recently-used idle runtime first, then stops the
# oldest busy runtime if needed. Evicted sessions rebuild from storage.
max_background_sessions = 8
# Undo/redo file checkpointing. Files larger than checkpoint_max_file_bytes are
# skipped (reported, not restored). checkpoints per session exceeding
# checkpoint_max_session_bytes drop the oldest snapshots.
checkpoint_max_file_bytes = 1048576
checkpoint_max_session_bytes = 16777216

# Bounded provider/history allocations. Values are clamped when loaded.
[memory]
enabled = true
# Provider-context recall is deliberately opt-in and currently reserved until
# the user explicitly authorizes persisted memory to leave local storage.
auto_recall = false
max_entries = 512
max_candidates = 128
max_entry_bytes = 16384
max_total_bytes = 8388608
max_recall_entries = 8
max_recall_bytes = 16384
max_sse_frame_bytes = 2097152
max_sse_buffer_bytes = 4194304
max_response_bytes = 2097152
max_tool_call_bytes = 1048576
max_tool_call_total_bytes = 4194304
max_tool_calls = 32
max_agent_event_bytes = 65536
max_history_items = 200
max_history_bytes = 1048576
max_history_item_bytes = 262144

[compaction]
enabled = true
auto_threshold = 0.80
target_ratio = 0.55
# preserve_recent_tokens = 8000
max_summary_bytes = 65536
# Recovery attempts after a provider-confirmed context overflow: each attempt
# compacts (or hard-trims) the conversation and retries only when the request
# actually shrank; failures beyond the cap surface the original error. 0 disables.
max_overflow_retries = 1

# Runtime model metadata discovery: GET {base_url}/models and the models.dev
# community database fill the context window for models the built-in registry
# does not know. Fetching is event-driven (provider/model switch, first submit
# with an unknown window, explicit settings refresh) - never polling, and the
# process never touches the network at startup. Explicit
# provider.context_window_tokens always wins; discovered values outside sane
# bounds are rejected, not clamped. Set fetch = false for a fully offline
# process (the registry and the committed models.dev snapshot still answer).
[model_metadata]
fetch = true
ttl_hours = 24 # 1..=168; gates refresh attempts only, cached values stay usable
timeout_ms = 5000 # 1000..=15000, per request

# Cluster mode (AI 集群) child-agent concurrency and execution budgets.
# Child concurrency is bounded by max_parallel_children.
[cluster]
max_parallel_children = 4
# Active model/tool time per child. Queueing and approval waits are excluded.
child_active_timeout_seconds = 300
child_max_output_bytes = 262144
child_max_tool_output_bytes = 131072
child_max_context_items = 48
child_max_context_bytes = 524288

[security]
allow_private_networks = false

[permissions.tools]
# file_write = "ask"
# file_delete = "deny"
# terminal_exec = "ask"
# web_fetch = "allow"
# web_search = "allow"

[browser]
enabled = false
command = ""
args = []
timeout_seconds = 30
max_output_bytes = 2097152
keep_alive_seconds = 30

# Custom slash commands expand {args} and {workspace} only.
# [[commands]]
# name = "review"
# description = "Review the current change"
# template = "Review the current git diff and list risks. {args}"

# Local stdio MCP subset (tools/list and tools/call).
# [[mcp_servers]]
# name = "local-tools"
# command = "my-mcp-server"
# args = []
# enabled = false
# timeout_seconds = 30
# max_output_bytes = 1048576

# Configured agent templates can be referenced from cluster mode via
# `agent_spawn(agent = "reviewer", ...)`.
# [[agents]]
# name = "reviewer"
# mode = "explore"
# max_turns = 3 # optional hard limit; omit or set 0 for unlimited turns
# allowed_tools = ["file_read", "file_search", "git"]
# system_prompt = "Review code for correctness and security."
